# PRODUCTION stack. Runs side by side with compose.staging.yaml on the same
# server; the `name:` below gives this stack its own Compose project, so its
# `internal` network, containers, and data are fully isolated from staging.
#
# Where staging deliberately opts OUT of the homelab house rules, production
# opts back IN:
#   - NO published ports (same as staging). The only ingress is the Cloudflare
#     Tunnel reaching `dontforget-prod-powersync:${PS_PORT}`,
#     `dontforget-prod-api:8080`, and `dontforget-prod-web:8080` over proxy-net;
#     both Postgres instances are on the internal network only.
#   - Bind mounts under ./data/ instead of named volumes: production is NOT
#     wipeable, and `docker compose down -v` must never be able to destroy it.
#   - Postgres container names END in `-db` so the nightly backup script's
#     pg_dumpall loop picks them up. (The storage DB is rebuildable from the
#     source DB, but backing it up is harmless and keeps the rule simple.)
#   - The server's repo-root .env.production (never committed) sets
#     COMPOSE_FILE=infra/compose.production.yaml plus production-only PG_*
#     credentials, Clerk keys, and public URLs — never reuse staging values.
#
# SCHEMA AUTHORITY and REPLICATION COUPLING notes in docker-compose.yaml apply
# here unchanged: apply schema via drizzle-kit migrate against the source
# Postgres, and wal_level=logical + the `powersync` publication are both
# required. Connection URIs are assembled HERE from the PG_* parts in
# .env.production so each credential is stated exactly once.

name: dontforget-prod

services:
  api:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    container_name: dontforget-prod-api
    restart: unless-stopped
    depends_on:
      pg-source:
        condition: service_healthy
    environment:
      APP_ENV: production
      API_PORT: 8080
      DATABASE_URL: postgresql://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@pg-source:5432/${PG_DATABASE_NAME}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN}
      POSTHOG_HOST: ${POSTHOG_HOST}
    networks:
      - proxy-net # web-facing: the tunnel routes API traffic here
      - internal # reaches dontforget-prod-source-db
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
      target: builder
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@pg-source:5432/${PG_DATABASE_NAME}
    command:
      [
        "pnpm",
        "--dir",
        "packages/db",
        "exec",
        "drizzle-kit",
        "migrate",
        "--config=src/drizzle/postgres.migrate.ts",
      ]
    depends_on:
      pg-source:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
      args:
        APP_ENV: production
    container_name: dontforget-prod-web
    restart: unless-stopped
    networks:
      - proxy-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/.well-known/apple-app-site-association || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  pg-source:
    image: postgres:18
    container_name: dontforget-prod-source-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_DB: ${PG_DATABASE_NAME}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    # wal_level=logical is REQUIRED for PowerSync replication.
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      # Relative to this file, so on the server: <repo>/infra/data/pg-source
      - ./data/pg-source:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER} -d ${PG_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-storage:
    image: postgres:18
    container_name: dontforget-prod-storage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_STORAGE_DATABASE_USER}
      POSTGRES_DB: ${PG_STORAGE_DATABASE_NAME}
      POSTGRES_PASSWORD: ${PG_STORAGE_DATABASE_PASSWORD}
    volumes:
      - ./data/pg-storage:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_STORAGE_DATABASE_USER} -d ${PG_STORAGE_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:1.23.3
    container_name: dontforget-prod-powersync
    restart: unless-stopped
    depends_on:
      pg-source:
        condition: service_healthy
      pg-storage:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    volumes:
      - ./powersync:/config
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@pg-source:5432/${PG_DATABASE_NAME}
      PS_STORAGE_SOURCE_URI: postgresql://${PG_STORAGE_DATABASE_USER}:${PG_STORAGE_DATABASE_PASSWORD}@pg-storage:5432/${PG_STORAGE_DATABASE_NAME}
      PS_PORT: ${PS_PORT}
      PS_CLERK_JWKS_URI: ${PS_CLERK_JWKS_URI}
    networks:
      - proxy-net # web-facing: the tunnel routes sync traffic here
      - internal # and it reaches both Postgres instances here
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${PS_PORT}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 2s
      retries: 20

networks:
  proxy-net:
    external: true
  internal:
