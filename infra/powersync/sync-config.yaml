# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Sync STREAMS (edition 3) — NOT legacy sync rules.
# IDENTITY MODEL: auth.user_id() is the Clerk `sub` (the external auth id). This
# app keeps users.id (app-generated) SEPARATE from users.clerk_user_id so the
# data model stays decoupled from the auth provider, and /api/data resolves the
# internal users.id from the Clerk sub. These streams resolve it the same way —
# the internal id via (SELECT id FROM users WHERE clerk_user_id = auth.user_id()).
# A connected user receives exactly:
#   - their own users row (matched by clerk_user_id)
#   - their memberships
#   - the households they belong to (active membership == removed_at IS NULL)
#   - all lists/items/item_checks of those households
#
# items/item_checks have no household_id; they reach the Household through
# list_id -> lists.household_id (nested subqueries).
#
# Plan B (if the nested join fails the acceptance gate): denormalize
# household_id onto items + item_checks and flatten my_items/my_item_checks to
# a single-level household_id IN (...) filter. This is an operator decision.

config:
  edition: 3

streams:
  # The signed-in user's own profile row (matched by external auth id).
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM users WHERE clerk_user_id = auth.user_id()

  # The user's memberships (internal user_id resolved from the Clerk sub).
  my_memberships:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM memberships
        WHERE user_id IN (
          SELECT id FROM users WHERE clerk_user_id = auth.user_id()
        ) AND removed_at IS NULL

  # Households the user is an active member of.
  my_households:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM households
        WHERE id IN (
          SELECT household_id FROM memberships
          WHERE user_id IN (
            SELECT id FROM users WHERE clerk_user_id = auth.user_id()
          ) AND removed_at IS NULL
        )

  # All lists of those households (lists carry household_id directly).
  my_lists:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM lists
        WHERE household_id IN (
          SELECT household_id FROM memberships
          WHERE user_id IN (
            SELECT id FROM users WHERE clerk_user_id = auth.user_id()
          ) AND removed_at IS NULL
        )

  # All items of those households, reached via list_id -> lists.household_id.
  my_items:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM items
        WHERE list_id IN (
          SELECT id FROM lists
          WHERE household_id IN (
            SELECT household_id FROM memberships
            WHERE user_id IN (
              SELECT id FROM users WHERE clerk_user_id = auth.user_id()
            ) AND removed_at IS NULL
          )
        )

  # All shared item-keyed checks (Decision 9) of those households' items,
  # via item_id -> items -> lists.
  my_item_checks:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM item_checks
        WHERE item_id IN (
          SELECT id FROM items
          WHERE list_id IN (
            SELECT id FROM lists
            WHERE household_id IN (
              SELECT household_id FROM memberships
              WHERE user_id IN (
                SELECT id FROM users WHERE clerk_user_id = auth.user_id()
              ) AND removed_at IS NULL
            )
          )
        )
