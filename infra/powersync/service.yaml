# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
#
# PowerSync self-hosted service config (production form).
# - replication: single source Postgres (all Households).
# - storage: separate Postgres (bucket storage; no MongoDB).
# - client_auth: ONLY the Clerk frontend-API JWKS (no static dev key). Clerk
#   session tokens are verified against the remote JWKS. PowerSync REQUIRES the
#   JWT carry an `aud` in client_auth.audience; a Clerk JWT template named
#   `powersync` (aud: powersync) supplies it.

_type: self-hosted

telemetry:
  disable_telemetry_sharing: false

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_SOURCE_URI
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # Clerk frontend-API JWKS URL for THIS environment's Clerk instance, e.g.
  # https://<subdomain>.clerk.accounts.dev/.well-known/jwks.json (dev) or the
  # production Clerk domain. The domain is PUBLIC (derivable from the
  # pk_test_/pk_live_ publishable key) but environment-specific, so it is
  # injected via the PS_CLERK_JWKS_URI env var. (PowerSync only substitutes env
  # vars whose names start with PS_.) Set it per-env in .env / the deploy env.
  jwks_uri: !env PS_CLERK_JWKS_URI
  # PowerSync REQUIRES the JWT carry an `aud` in this list. The Clerk JWT
  # template named `powersync` (aud: powersync) supplies it; same value in every
  # environment.
  audience: ["powersync"]

system:
  logging:
    level: info
    format: text
