# the staging house rules applied:
#   - NO published ports. The only ingress is the Cloudflare Tunnel reaching
#     `dontforget-staging-powersync:${PS_PORT}`, `dontforget-staging-api:8080`,
#     and `dontforget-staging-web:8080` over proxy-net; both Postgres instances
#     are on the internal network only.
#   - Named volumes on purpose: staging is wipeable with `docker compose down -v`
#     (fresh DBs, re-run drizzle-kit migrate). Container names deliberately do
#     NOT end in `-db` so the nightly backup script's pg_dumpall loop skips them.
#   - The server's repo-root .env.staging (never committed) sets
#     COMPOSE_FILE=infra/compose.staging.yaml so `make infra-up APP_ENV=staging`
#     and `docker compose --env-file .env.staging` use this file there.
#
# SCHEMA AUTHORITY and REPLICATION COUPLING notes in docker-compose.yaml apply
# here unchanged: apply schema via drizzle-kit migrate against the source
# Postgres, and wal_level=logical + the `powersync` publication are both
# required. Connection URIs are assembled HERE from the PG_* parts in
# .env.staging so each credential is stated exactly once.

name: dontforget-staging

services:
  api:
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
    container_name: dontforget-staging-api
    restart: unless-stopped
    depends_on:
      pg-source:
        condition: service_healthy
    environment:
      APP_ENV: staging
      API_PORT: 8080
      DATABASE_URL: postgresql://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@pg-source:5432/${PG_DATABASE_NAME}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN}
      POSTHOG_HOST: ${POSTHOG_HOST}
    networks:
      - proxy-net # web-facing: the tunnel routes API traffic here
      - internal # reaches dontforget-staging-pg-source
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: infra/api/Dockerfile
      target: builder
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@pg-source:5432/${PG_DATABASE_NAME}
    command:
      [
        "pnpm",
        "--dir",
        "packages/db",
        "exec",
        "drizzle-kit",
        "migrate",
        "--config=src/drizzle/postgres.migrate.ts",
      ]
    depends_on:
      pg-source:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: infra/web/Dockerfile
      args:
        APP_ENV: staging
    container_name: dontforget-staging-web
    restart: unless-stopped
    networks:
      - proxy-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/.well-known/apple-app-site-association || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  pg-source:
    image: postgres:18
    container_name: dontforget-staging-pg-source
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_DB: ${PG_DATABASE_NAME}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    # wal_level=logical is REQUIRED for PowerSync replication.
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pg_source_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER} -d ${PG_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-storage:
    image: postgres:18
    container_name: dontforget-staging-pg-storage
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_STORAGE_DATABASE_USER}
      POSTGRES_DB: ${PG_STORAGE_DATABASE_NAME}
      POSTGRES_PASSWORD: ${PG_STORAGE_DATABASE_PASSWORD}
    volumes:
      - pg_storage_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_STORAGE_DATABASE_USER} -d ${PG_STORAGE_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  powersync:
    image: journeyapps/powersync-service:1.23.3
    container_name: dontforget-staging-powersync
    restart: unless-stopped
    depends_on:
      pg-source:
        condition: service_healthy
      pg-storage:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    volumes:
      - ./powersync:/config
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: postgresql://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@pg-source:5432/${PG_DATABASE_NAME}
      PS_STORAGE_SOURCE_URI: postgresql://${PG_STORAGE_DATABASE_USER}:${PG_STORAGE_DATABASE_PASSWORD}@pg-storage:5432/${PG_STORAGE_DATABASE_NAME}
      PS_PORT: ${PS_PORT}
      PS_CLERK_JWKS_URI: ${PS_CLERK_JWKS_URI}
    networks:
      - proxy-net # web-facing: the tunnel routes sync traffic here
      - internal # and it reaches both Postgres instances here
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${PS_PORT}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  pg_source_data:
  pg_storage_data:

networks:
  proxy-net:
    external: true
  internal:
