# Local PowerSync stack: single source Postgres (all Households) + a separate
# Postgres for PowerSync bucket storage (no MongoDB) + the PowerSync service.
#
# SCHEMA AUTHORITY: the source Postgres schema is owned by the Drizzle pg
# migrations (db/migrations/postgres), NOT a hand-written init script. After the
# stack is up, apply schema with a one-shot drizzle-kit migrate against
# PS_DATA_SOURCE_URI, then the PowerSync publication:
#   DATABASE_URL=$PS_DATA_SOURCE_URI pnpm exec drizzle-kit migrate \
#     --config=db/drizzle/postgres.config.ts
# (0001_powersync_publication.sql runs as part of that migrate sequence.)
#
# REPLICATION COUPLING: both wal_level=logical (the pg-source command below) AND
# the `powersync` publication (db/migrations/postgres/0001_*.sql) must be present
# or logical replication silently never starts.
#
# This is a working LOCAL stack only; VPS hardening / private networking / route
# relocation is PR-E. The /api/data write endpoint lives in the app's Expo API
# routes (app/api/data+api.ts), so there is no backend container here.

services:
  # ---- Source Postgres: holds users/households/memberships/lists/items/item_checks
  pg-source:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_DB: ${PG_DATABASE_NAME}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
    # wal_level=logical is REQUIRED for PowerSync replication.
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pg_source_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER} -d ${PG_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Bucket-storage Postgres: internal to PowerSync, separate from the source.
  pg-storage:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_STORAGE_DATABASE_USER}
      POSTGRES_DB: ${PG_STORAGE_DATABASE_NAME}
      POSTGRES_PASSWORD: ${PG_STORAGE_DATABASE_PASSWORD}
    volumes:
      - pg_storage_data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_STORAGE_DATABASE_USER} -d ${PG_STORAGE_DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- PowerSync sync service (API + replication worker, unified).
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      pg-source:
        condition: service_healthy
      pg-storage:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    volumes:
      - ./powersync:/config
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_STORAGE_SOURCE_URI: ${PS_STORAGE_SOURCE_URI}
      PS_PORT: ${PS_PORT}
    ports:
      - "${PS_PORT}:${PS_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${PS_PORT}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  pg_source_data:
  pg_storage_data:
