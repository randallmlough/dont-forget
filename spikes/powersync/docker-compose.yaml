# Self-contained spike stack: single source Postgres (all Households) +
# separate Postgres for PowerSync bucket storage (no MongoDB) + PowerSync
# service + a Node upload endpoint.
#
# Derived from powersync-ja/self-host-demo demos/nodejs-postgres-bucket-storage,
# flattened (no `include`/`extends`) so the whole stack is readable in one file.

services:
  # ---- Source Postgres: holds users/households/memberships/lists/items/item_checks
  pg-source:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_DB: ${PG_DATABASE_NAME}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      PGPORT: ${PG_DATABASE_PORT}
    # wal_level=logical is required for PowerSync replication.
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - pg_source_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "${PG_DATABASE_PORT}:${PG_DATABASE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER} -d ${PG_DATABASE_NAME} -p ${PG_DATABASE_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- Bucket-storage Postgres: internal to PowerSync, separate from the source.
  pg-storage:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_STORAGE_DATABASE_USER}
      POSTGRES_DB: ${PG_STORAGE_DATABASE_NAME}
      POSTGRES_PASSWORD: ${PG_STORAGE_DATABASE_PASSWORD}
      PGPORT: ${PG_STORAGE_DATABASE_PORT}
    volumes:
      - pg_storage_data:/var/lib/postgresql
    ports:
      - "${PG_STORAGE_DATABASE_PORT}:${PG_STORAGE_DATABASE_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_STORAGE_DATABASE_USER} -d ${PG_STORAGE_DATABASE_NAME} -p ${PG_STORAGE_DATABASE_PORT}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---- PowerSync sync service (API + replication worker, unified).
  powersync:
    image: journeyapps/powersync-service:1.22.0
    restart: unless-stopped
    depends_on:
      pg-source:
        condition: service_healthy
      pg-storage:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    volumes:
      - ./powersync:/config
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_DATA_SOURCE_URI: ${PS_DATA_SOURCE_URI}
      PS_STORAGE_SOURCE_URI: ${PS_STORAGE_SOURCE_URI}
      PS_PORT: ${PS_PORT}
    ports:
      - "${PS_PORT}:${PS_PORT}"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${PS_PORT}/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 2s
      retries: 20

  # ---- Node upload endpoint: applies client CRUD to source Postgres with
  #      LWW-by-updated_at and membership authorization.
  backend:
    image: node:22-alpine
    restart: unless-stopped
    depends_on:
      pg-source:
        condition: service_healthy
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./backend:/app
      # Public key for JWT verification (read-only). Resolved as ../keys from /app.
      - ./keys:/keys:ro
    environment:
      PORT: ${DEMO_BACKEND_PORT}
      DATABASE_URI: ${PS_DATA_SOURCE_URI}
    ports:
      - "${DEMO_BACKEND_PORT}:${DEMO_BACKEND_PORT}"

volumes:
  pg_source_data:
  pg_storage_data:
