# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Sync STREAMS (edition 3, GA May 2026) — NOT legacy sync rules.
# A connected user (auth.user_id() == JWT sub) receives exactly:
#   - their own users row
#   - their memberships
#   - the households they belong to
#   - all lists/items/item_checks of those households
#
# items/item_checks have no household_id; they reach the Household through
# list_id -> lists.household_id (nested subqueries). Whether the service
# resolves this is the empirical question recorded in NOTES.md.

config:
  edition: 3

streams:
  # The signed-in user's own profile row.
  me:
    auto_subscribe: true
    queries:
      - SELECT * FROM users WHERE id = auth.user_id()

  # The user's memberships.
  my_memberships:
    auto_subscribe: true
    queries:
      - SELECT * FROM memberships WHERE user_id = auth.user_id()

  # Households the user is an active member of.
  my_households:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM households
        WHERE id IN (
          SELECT household_id FROM memberships
          WHERE user_id = auth.user_id() AND status = 'active'
        )

  # All lists of those households (lists carry household_id directly).
  my_lists:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM lists
        WHERE household_id IN (
          SELECT household_id FROM memberships
          WHERE user_id = auth.user_id() AND status = 'active'
        )

  # All items of those households, reached via list_id -> lists.household_id.
  my_items:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM items
        WHERE list_id IN (
          SELECT id FROM lists
          WHERE household_id IN (
            SELECT household_id FROM memberships
            WHERE user_id = auth.user_id() AND status = 'active'
          )
        )

  # All per-user checks of those households' items, via item_id -> items -> lists.
  my_item_checks:
    auto_subscribe: true
    queries:
      - >-
        SELECT * FROM item_checks
        WHERE item_id IN (
          SELECT id FROM items
          WHERE list_id IN (
            SELECT id FROM lists
            WHERE household_id IN (
              SELECT household_id FROM memberships
              WHERE user_id = auth.user_id() AND status = 'active'
            )
          )
        )
