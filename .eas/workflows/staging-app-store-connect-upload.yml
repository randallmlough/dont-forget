name: Staging App Store Connect Upload

on:
  workflow_dispatch: {}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  build_ios:
    name: Build staging iOS
    type: build
    environment: preview
    env:
      APP_ENV: staging
    params:
      platform: ios
      profile: staging
      message: Staging App Store Connect upload

  submit_ios:
    name: Submit staging iOS
    needs: [build_ios]
    type: submit
    environment: preview
    env:
      APP_ENV: staging
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: staging
